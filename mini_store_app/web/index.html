<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mini Store — a responsive shopping app built with Flutter.">
  <meta name="theme-color" content="#2563EB">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mini Store">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mini Store</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F9FAFB;
    }

    #mini-store-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #F9FAFB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      transition: opacity 180ms ease;
    }

    #mini-store-loader .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #2563EB;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.24);
    }

    #mini-store-loader .brand-name {
      margin-top: 6px;
      color: #1F2937;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    #mini-store-loader .loading-label {
      color: #6B7280;
      font-size: 13px;
    }

    #mini-store-loader .spinner {
      width: 26px;
      height: 26px;
      margin-top: 10px;
      border: 3px solid #DBEAFE;
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: mini-store-spin 750ms linear infinite;
    }

    @keyframes mini-store-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #mini-store-loader .spinner { animation-duration: 1800ms; }
    }
  </style>
</head>
<body>
  <div id="mini-store-loader" role="status" aria-live="polite">
    <div class="brand-mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M6 8h12l-1 11H7L6 8Z" stroke="#FFFFFF" stroke-width="1.8"
          stroke-linejoin="round"/>
        <path d="M9 9V6.5a3 3 0 0 1 6 0V9" stroke="#FFFFFF" stroke-width="1.8"
          stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-name">Mini Store</div>
    <div class="loading-label">Loading your store…</div>
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <noscript>
    <div style="padding: 24px; color: #1F2937; font-family: sans-serif;">
      Mini Store needs JavaScript to run in the browser.
    </div>
  </noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('mini-store-loader');
      if (!loader) {
        return;
      }

      loader.style.opacity = '0';
      loader.addEventListener('transitionend', function () {
        loader.remove();
      }, { once: true });

      // Guarantee removal even when transitions are disabled.
      setTimeout(function () {
        if (loader.parentNode) {
          loader.remove();
        }
      }, 400);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
